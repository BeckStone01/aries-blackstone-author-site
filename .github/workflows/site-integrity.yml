name: Aries Blackstone Site Integrity

on:
  push:
    branches:
      - main
      - brand-authority-discovery-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  integrity:
    name: Verify complete public site source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check site source integrity
        run: node scripts/check-site-integrity.mjs
